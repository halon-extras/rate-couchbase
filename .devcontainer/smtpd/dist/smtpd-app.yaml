resolver:
  cache:
    size: 10000
scripting:
  files:
  - data: |
      import { rate_fixed_window } from "file://main.hsl";

      $time = 30;
      $item = 2;
      $interval = 2;

      $x = 0;
      $t = time();
      while ((time() - $t) < $time)
      {
          if (rate_fixed_window("foo", "bar", $item, $interval))
          {
              $x++;
              echo $x . " during " .  (time() - $t) . "s   " . ($x / (time() - $t));
          }
          sleep(0.01);
      }
    id: test.hsl
servers:
- id: default
  transport: mx
transportgroups:
- dsn:
    transport: mx
  id: default
  retry:
    count: 30
    intervals:
    - interval: 60
    - interval: 900
    - interval: 3600
      notify: true
    - interval: 7200
    - interval: 10800
  transports:
  - id: mx
    session:
      tls:
        mode: dane
version: '6.11'
